var currentMode = 'population';

var COLOR_SCALES = {
  population: {
    title: 'Population',
    breaks: [
      { min: 0,    max: 2e6,      color: '#fee5d9', label: '< 2M' },
      { min: 2e6,  max: 5e6,      color: '#fcbba1', label: '2M – 5M' },
      { min: 5e6,  max: 10e6,     color: '#fc9272', label: '5M – 10M' },
      { min: 10e6, max: 25e6,     color: '#fb6a4a', label: '10M – 25M' },
      { min: 25e6, max: 50e6,     color: '#de2d26', label: '25M – 50M' },
      { min: 50e6, max: Infinity,  color: '#a50f15', label: '50M+' },
    ],
    getValue: function(p) { return p.population; },
  },
  desalination: {
    title: 'Desalination % of Water',
    breaks: [
      { min: 0,  max: 1,        color: '#f7fbff', label: '0%' },
      { min: 1,  max: 10,       color: '#c6dbef', label: '1 – 9%' },
      { min: 10, max: 25,       color: '#6baed6', label: '10 – 24%' },
      { min: 25, max: 50,       color: '#2171b5', label: '25 – 49%' },
      { min: 50, max: Infinity,  color: '#08306b', label: '50%+' },
    ],
    getValue: function(p) { return p.desalination_pct; },
  },
};

function getColor(value, scale) {
  if (value == null) return '#ccc';
  for (var i = 0; i < scale.breaks.length; i++) {
    var b = scale.breaks[i];
    if (value >= b.min && value < b.max) return b.color;
  }
  return scale.breaks[scale.breaks.length - 1].color;
}

function formatPop(n) {
  if (n == null) return 'N/A';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
  return n.toLocaleString();
}

var map = L.map('map', { zoomControl: true }).setView([29, 47], 4);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 10,
}).addTo(map);

// Hover info control
var info = L.control({ position: 'topright' });
info.onAdd = function () {
  this._div = L.DomUtil.create('div', 'info-box');
  this.update();
  return this._div;
};
info.update = function (props) {
  if (props) {
    this._div.innerHTML = '<h4>' + props.name + '</h4>' +
      '<p><strong>Population:</strong> ' + formatPop(props.population) + '</p>' +
      '<p><strong>Area:</strong> ' + (props.area ? Number(props.area).toLocaleString() + ' km²' : 'N/A') + '</p>' +
      '<p><strong>Density:</strong> ' + (props.density != null ? props.density.toLocaleString() + ' /km²' : 'N/A') + '</p>' +
      '<p><strong>Desalination:</strong> ' + (props.desalination_pct != null ? props.desalination_pct + '% of water supply' : 'N/A') + '</p>';
  } else {
    this._div.innerHTML = '<p style="color:#888">Hover over a country</p>';
  }
};
info.addTo(map);

// Mode toggle control
var modeControl = L.control({ position: 'topleft' });
modeControl.onAdd = function () {
  var div = L.DomUtil.create('div', 'mode-control');
  div.innerHTML = '<h4>Color by</h4>' +
    '<label><input type="radio" name="mode" value="population" checked> Population</label>' +
    '<label><input type="radio" name="mode" value="desalination"> Desalination %</label>';
  L.DomEvent.disableClickPropagation(div);
  div.addEventListener('change', function(e) {
    if (e.target.name === 'mode') {
      currentMode = e.target.value;
      updateMap();
    }
  });
  return div;
};
modeControl.addTo(map);

// Legend
var legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  this._div = L.DomUtil.create('div', 'legend');
  this.updateLegend();
  return this._div;
};
legend.updateLegend = function () {
  var scale = COLOR_SCALES[currentMode];
  this._div.innerHTML = '<h4>' + scale.title + '</h4>' +
    scale.breaks.map(function(b) {
      return '<div class="legend-item"><span class="legend-color" style="background:' + b.color + '"></span>' + b.label + '</div>';
    }).join('');
};
legend.addTo(map);

// Render choropleth
var geoLayer = L.geoJSON(ME_GEOJSON, {
  style: function (feature) {
    var scale = COLOR_SCALES[currentMode];
    var value = scale.getValue(feature.properties);
    return {
      fillColor: getColor(value, scale),
      weight: 1.5,
      color: '#000',
      fillOpacity: 0.8,
    };
  },
  onEachFeature: function (feature, layer) {
    layer.on({
      mouseover: function (e) {
        e.target.setStyle({ weight: 3, color: '#000', fillOpacity: 0.95 });
        e.target.bringToFront();
        info.update(feature.properties);
      },
      mouseout: function (e) {
        geoLayer.resetStyle(e.target);
        info.update();
      },
    });
  },
}).addTo(map);

function updateMap() {
  geoLayer.setStyle(function (feature) {
    var scale = COLOR_SCALES[currentMode];
    var value = scale.getValue(feature.properties);
    return {
      fillColor: getColor(value, scale),
      weight: 1.5,
      color: '#000',
      fillOpacity: 0.8,
    };
  });
  legend.updateLegend();
}

// Country name labels
ME_GEOJSON.features.forEach(function(f) {
  var p = f.properties;
  if (p.lat == null || p.lng == null) return;
  L.marker([p.lat, p.lng], {
    icon: L.divIcon({
      className: 'country-label',
      html: p.name,
      iconSize: null,
    }),
    interactive: false,
  }).addTo(map);
});
